replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  # minAvailable is an explicit null: with one replica, minAvailable 1 makes the
  # pod unevictable, which pins its node (Karpenter cannot replace it, and EKS
  # upgrades stall on it). maxUnavailable 1 allows one eviction at a time; the
  # pod is back within seconds. Never set both: Kubernetes rejects that PDB.
  minAvailable: null
  maxUnavailable: 1
ingress:
  enabled: false
service:
  enabled: false
livenessProbe:
  probeType: exec
  command:
    - /bin/sh
    - '-c'
    - '[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false'
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 10
readinessProbe:
  probeType: exec
  command:
    - /bin/sh
    - '-c'
    - '[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false'
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 10
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
extraLabels:
  tenant: courierexp
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: tenant
              operator: In
              values:
                - courierexp
tolerations:
  - key: tenant
    operator: Equal
    value: courierexp
    effect: NoSchedule
