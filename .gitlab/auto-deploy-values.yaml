# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable:

ingress:
  enabled: false
service:
  enabled: false

livenessProbe:
  probeType: exec
  command:
    - /bin/sh
    - -c
    - "[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false"
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 10
readinessProbe:
  probeType: exec
  command:
    - /bin/sh
    - -c
    - "[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false"
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 10

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
