replicaCount: 1

extraLabels:
  tenant: mpf

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: tenant
          operator: In
          values:
          - mpf

tolerations:
  - key: tenant
    operator: Equal
    value: mpf
    effect: NoSchedule

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 85

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable:

ingress:
  enabled: false
service:
  enabled: false

livenessProbe:
  probeType: exec
  command:
    - /bin/sh
    - -c
    - "[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false"
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 10
readinessProbe:
  probeType: exec
  command:
    - /bin/sh
    - -c
    - "[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false"
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 10

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
