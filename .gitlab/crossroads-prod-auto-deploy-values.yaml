replicaCount: 1

extraLabels:
  tenant: crossroads

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: tenant
          operator: In
          values:
          - crossroads

tolerations:
  - key: tenant
    operator: Equal
    value: crossroads
    effect: NoSchedule

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 85

podDisruptionBudget:
  enabled: true
  # minAvailable is an explicit null: with one replica, minAvailable 1 makes the
  # pod unevictable, which pins its node (Karpenter cannot replace it, and EKS
  # upgrades stall on it). maxUnavailable 1 allows one eviction at a time; the
  # pod is back within seconds. Never set both: Kubernetes rejects that PDB.
  minAvailable: null
  maxUnavailable: 1

ingress:
  enabled: false
service:
  enabled: false

livenessProbe:
  probeType: exec
  command:
    - /bin/sh
    - -c
    - "[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false"
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 10
readinessProbe:
  probeType: exec
  command:
    - /bin/sh
    - -c
    - "[ $(find /tmp/healthy -mmin -2 | wc -l) -eq 1 ] || false"
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 10

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
